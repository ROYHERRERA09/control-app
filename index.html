<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Control</title>
<meta name="theme-color" content="#16213E" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Control" />
<style>
  :root { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #F5F6F8;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<div id="cc-root"></div>
<style>
  #cc-root {
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --navy: #16213E;
    --navySoft: #6B7A99;
    --border: #E5E8EE;
    --yellow: #FFC72C;
    --yellowSoft: #FFF3D6;
    --mintBg: #E1F5EC;
    --mintText: #1E9E6B;
    --coralBg: #FDE6E3;
    --coralText: #E0473A;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    position: relative;
  }
  #cc-root * { box-sizing: border-box; }

  /* ---- sidebar (slide-in drawer) ---- */
  .cc-sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 240px; background: #fff;
    border-right: 1px solid var(--border);
    padding: calc(20px + env(safe-area-inset-top, 0px)) 14px calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-105%); transition: transform .26s cubic-bezier(.32,.72,0,1);
    z-index: 70; overflow-y: auto;
  }
  .cc-sidebar.open { transform: translateX(0); }
  .cc-sidebar-overlay { position: fixed; inset: 0; background: rgba(22,33,62,.42); z-index: 65; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .cc-sidebar-overlay.open { opacity: 1; pointer-events: auto; }
  .cc-main { flex: 1; min-width: 0; }
  .cc-sb-logo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; padding: 0 6px; }
  .cc-logo { width: 30px; height: 30px; background: var(--yellow); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--navy); font-weight: 800; font-size: 15px; flex: none; }
  .cc-brand { font-weight: 800; font-size: 15px; color: var(--navy); }
  .cc-sb-profile { display: flex; align-items: center; gap: 10px; padding: 8px 6px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .cc-avatar { width: 34px; height: 34px; border-radius: 50%; background: #EEE7FA; color: #7C5CBF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex: none; }
  .cc-sb-profile-name { font-size: 13px; font-weight: 700; color: var(--navy); margin: 0; }
  .cc-sb-profile-role { font-size: 11px; color: var(--navySoft); margin: 0; }
  .cc-sb-section { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--navySoft); margin: 14px 6px 6px; text-transform: uppercase; }
  .cc-nav-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; background: none; border: none;
    padding: 9px 7px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--navy); cursor: pointer; font: inherit; line-height: 1.25;
    transition: background-color .15s ease, transform .1s ease;
  }
  .cc-nav-item:active { transform: scale(0.97); }
  .cc-nav-item .cc-nav-icon { width: 20px; text-align: center; flex: none; font-size: 13.5px; }
  .cc-nav-item.active { background: var(--yellowSoft); color: var(--navy); font-weight: 800; }
  .cc-nav-item.logout { color: #E0473A; margin-top: 10px; }
  .cc-sb-version { font-size: 9px; color: var(--navySoft); text-align: center; margin-top: 18px; }

  /* ---- bottom tab bar ---- */
  .cc-bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--border);
    display: flex; z-index: 44; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .cc-bottomnav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 4px 7px; background: none; border: none; font: inherit; cursor: pointer;
    color: var(--navySoft); font-size: 10.5px; font-weight: 700; transition: color .15s ease;
  }
  .cc-bottomnav-item.active { color: var(--navy); }
  .cc-bottomnav-icon { font-size: 19px; line-height: 1; }
  .cc-bottomnav-icon.active-dot { position: relative; }

  /* ---- Inicio (home) page ---- */
  .cc-home-hero { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(22,33,62,0.06); }
  .cc-home-hero-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 2px; }
  .cc-home-hero-main { min-width: 0; flex: 1 1 auto; }
  .cc-home-hero-label { font-size: 13px; color: var(--navySoft); font-weight: 600; margin: 0 0 4px; }
  .cc-home-hero-amount { font-size: 28px; font-weight: 800; color: var(--navy); margin: 0; font-variant-numeric: tabular-nums; word-break: break-word; line-height: 1.15; }
  .cc-home-vs { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex: none; }
  .cc-home-vs.up { background: var(--mintBg); color: var(--mintText); }
  .cc-home-vs.down { background: var(--coralBg); color: var(--coralText); }
  .cc-home-split { display: flex; border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; gap: 10px; }
  .cc-home-split-col { flex: 1; }
  .cc-home-split-amount { font-size: 18px; font-weight: 800; margin: 0 0 2px; font-variant-numeric: tabular-nums; }
  .cc-home-split-label { font-size: 11.5px; color: var(--navySoft); margin: 0; }
  .cc-home-cta {
    width: 100%; margin-top: 16px; background: var(--navy); color: #fff; border: none; border-radius: 999px;
    padding: 14px; font-size: 14px; font-weight: 800; cursor: pointer; font: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .12s ease, opacity .12s ease;
  }
  .cc-home-cta:active { transform: scale(0.98); opacity: .92; }
  .cc-home-section-title { font-size: 15px; font-weight: 800; color: var(--navy); margin: 0 0 12px; }
  .cc-home-carousel { display: flex; gap: 6px; margin-bottom: 20px; }
  .cc-home-card {
    flex: 1 1 0; min-width: 0; background: var(--card); border-radius: 12px; padding: 10px 4px; text-align: center;
    box-shadow: 0 2px 10px rgba(22,33,62,0.06); border: none; font: inherit; cursor: pointer;
    transition: transform .12s ease;
  }
  .cc-home-card:active { transform: scale(0.95); }
  .cc-home-card-icon { font-size: 21px; margin-bottom: 6px; }
  .cc-home-card-label { font-size: 10px; font-weight: 700; color: var(--navy); line-height: 1.2; word-break: break-word; }
  .cc-home-stats-row { display: flex; gap: 10px; }
  .cc-home-stat-card { flex: 1; background: var(--bg); border-radius: 12px; padding: 12px; }
  .cc-home-stat-title { font-size: 11px; color: var(--navySoft); font-weight: 700; margin: 0 0 8px; }
  .cc-home-stat-value { font-size: 16px; font-weight: 800; color: var(--navy); margin: 0 0 4px; }
  .cc-home-stat-sub { font-size: 10.5px; color: var(--navySoft); margin: 0; }
  .cc-home-viewall { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; background: none; border: none; color: var(--navy); font-weight: 700; font-size: 12.5px; padding: 12px 0 0; cursor: pointer; font: inherit; }

  /* ---- main ---- */
  .cc-wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(84px + env(safe-area-inset-bottom, 0px)); }

  .cc-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .cc-hamburger { background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 34px; height: 34px; flex: none; font-size: 15px; color: var(--navy); cursor: pointer; transition: transform .12s ease; }
  .cc-hamburger:active { transform: scale(0.92); }
  .cc-page-title { font-size: 19px; font-weight: 800; color: var(--navy); flex: 1; margin: 0; }
  .cc-header-actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .cc-btn-navy { background: var(--navy); color: #fff; border: none; border-radius: 999px; padding: 9px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; font: inherit; flex: 1; white-space: nowrap; transition: transform .12s ease, opacity .12s ease; }
  .cc-btn-navy:active { transform: scale(0.96); opacity: .9; }
  .cc-btn-outline { background: var(--card); color: var(--navy); border: 1px solid var(--border); border-radius: 999px; padding: 9px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; font: inherit; flex: 1; white-space: nowrap; transition: transform .12s ease, background-color .12s ease; }
  .cc-btn-outline:active { transform: scale(0.96); background: var(--bg); }

  .cc-filter-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .cc-filter-btn { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; font-weight: 700; color: var(--navy); cursor: pointer; font: inherit; display: flex; align-items: center; gap: 6px; }
  .cc-filter-btn.on { background: var(--navy); color: #fff; border-color: transparent; }
  .cc-select-wrap { position: relative; flex: 1; min-width: 110px; }
  .cc-select {
    appearance: none; -webkit-appearance: none; width: 100%; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 28px 9px 12px;
    font-size: 12.5px; font-weight: 700; color: var(--navy); font: inherit; cursor: pointer;
  }
  .cc-select-chevron { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--navySoft); font-size: 10px; pointer-events: none; }
  .cc-range-pill { flex: 1; min-width: 120px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: var(--navySoft); display: flex; align-items: center; justify-content: center; }
  .cc-search-wrap { position: relative; margin-bottom: 14px; }
  .cc-search { width: 100%; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 10px 12px 10px 32px; font-size: 13px; font: inherit; color: var(--navy); }
  .cc-search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--navySoft); font-size: 13px; }
  .cc-cat-filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .cc-cat-chip { border-radius: 999px; padding: 6px 12px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--border); background: var(--card); color: var(--navySoft); cursor: pointer; font: inherit; white-space: nowrap; flex: none; }
  .cc-cat-chip.active { background: var(--navy); color: #fff; border-color: transparent; }

  .cc-stats { display: flex; gap: 8px; margin-bottom: 16px; }
  .cc-stat { flex: 1; background: var(--card); border-radius: 14px; padding: 12px 10px; box-shadow: 0 2px 10px rgba(22,33,62,0.06); }
  .cc-stat-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 14px; }
  .cc-stat-icon.navy { background: #EAF0FB; color: var(--navy); }
  .cc-stat-icon.mint { background: var(--mintBg); color: var(--mintText); }
  .cc-stat-icon.coral { background: var(--coralBg); color: var(--coralText); }
  .cc-stat-label { font-size: 11px; color: var(--navySoft); font-weight: 600; margin: 0 0 3px; }
  .cc-stat-amount { font-size: 15.5px; font-weight: 800; margin: 0; font-variant-numeric: tabular-nums; }

  .cc-card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(22,33,62,0.06); }
  .cc-card-label { color: var(--navySoft); font-size: 12px; font-weight: 700; margin: 0 0 10px; }
  .cc-chart-svg { width: 100%; height: 150px; display: block; }

  .cc-tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--border); margin-bottom: 4px; overflow-x: auto; }
  .cc-tab { background: none; border: none; padding: 0 0 10px; font-size: 12.5px; font-weight: 700; color: var(--navySoft); cursor: pointer; font: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .15s ease, border-color .15s ease; }
  .cc-tab.active { color: var(--navy); border-bottom-color: var(--navy); }

  .cc-pending-total { display: flex; justify-content: space-between; align-items: center; background: var(--yellowSoft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 12.5px; font-weight: 700; color: var(--navy); }
  .cc-pending-total.pagar { background: #EAF0FB; }

  .cc-count-row { display: flex; justify-content: flex-end; margin: 10px 0 6px; }
  .cc-count { color: var(--navySoft); font-size: 12px; font-weight: 600; }

  .cc-empty { border: 1.5px dashed var(--border); color: var(--navySoft); border-radius: 14px; padding: 30px 16px; text-align: center; font-size: 13px; margin-bottom: 20px; background: var(--card); }
  .cc-list { list-style: none; margin: 0 0 16px; padding: 0; }
  .cc-row { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(22,33,62,0.05); }
  .cc-row-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cc-badge { border-radius: 50%; width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .cc-row-cat { font-size: 13.5px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--navy); }
  .cc-row-meta { font-size: 11.5px; color: var(--navySoft); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-row-right { display: flex; align-items: center; gap: 8px; flex: none; }
  .cc-amount { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cc-del { background: var(--bg); border: none; color: var(--navySoft); cursor: pointer; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; line-height: 1; }

  .cc-clear-link { background: none; border: none; color: var(--navySoft); text-decoration: underline; font-size: 12px; cursor: pointer; padding: 0; font-weight: 600; }
  .cc-confirm { display: flex; align-items: center; gap: 10px; font-size: 12px; flex-wrap: wrap; }
  .cc-confirm button { background: none; border: none; text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; font-weight: 700; }

  .cc-overlay { position: fixed; inset: 0; background: rgba(22,33,62,0.45); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .cc-overlay.open { opacity: 1; pointer-events: auto; }
  .cc-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--bg);
    border-radius: 22px 22px 0 0; padding: 20px 18px calc(28px + env(safe-area-inset-bottom, 0px));
    max-height: 88vh; overflow-y: auto; max-width: 520px; margin: 0 auto;
    transform: translateY(110%); transition: transform .32s cubic-bezier(.32,.72,0,1);
    pointer-events: none; box-shadow: 0 -8px 30px rgba(22,33,62,0.18);
  }
  .cc-sheet.open { transform: translateY(0); pointer-events: auto; }
  .cc-sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cc-sheet-title { font-size: 16px; font-weight: 800; margin: 0; color: var(--navy); }
  .cc-x { background: var(--card); border: 1px solid var(--border); color: var(--navySoft); font-size: 14px; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; }
  .cc-type-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .cc-type-btn { border-radius: 10px; padding: 9px 4px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: var(--card); color: var(--navySoft); cursor: pointer; font: inherit; }
  .cc-type-btn.active-ingreso { background: var(--mintBg); color: var(--mintText); border-color: transparent; }
  .cc-type-btn.active-egreso { background: var(--coralBg); color: var(--coralText); border-color: transparent; }
  .cc-type-btn.active-por_cobrar { background: var(--yellowSoft); color: #8A6A00; border-color: transparent; }
  .cc-type-btn.active-por_pagar { background: #EAF0FB; color: var(--navy); border-color: transparent; }
  .cc-label { color: var(--navySoft); font-size: 11.5px; font-weight: 700; display: block; margin-bottom: 6px; }
  .cc-input {
    width: 100%; border: 1px solid var(--border); background: var(--card); color: var(--navy);
    border-radius: 10px; padding: 11px 13px; margin-bottom: 14px; font-size: 13.5px; font: inherit;
  }
  .cc-input.amount { font-size: 18px; font-weight: 800; }
  .cc-chips { display: flex; gap: 6px; margin-bottom: 10px; }
  .cc-chips::-webkit-scrollbar { display: none; }
  .cc-chip { border-radius: 999px; padding: 6px 8px; font-size: 10.5px; font-weight: 600; border: 1px solid var(--border); background: var(--card); color: var(--navySoft); cursor: pointer; font: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; text-align: center; }
  .cc-chip.active { background: var(--navy); color: #fff; border-color: transparent; }
  .cc-error { color: var(--coralText); font-size: 12px; margin: 0 0 8px; font-weight: 600; }
  .cc-submit { width: 100%; border: none; color: #fff; background: var(--navy); border-radius: 999px; padding: 14px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 4px; transition: transform .12s ease, opacity .12s ease; }
  .cc-submit:active { transform: scale(0.98); opacity: .92; }

  .cc-fab-yellow { position: fixed; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); right: 22px; background: var(--yellow); color: var(--navy); border: none; border-radius: 50%; width: 56px; height: 56px; font-size: 26px; font-weight: 700; line-height: 1; cursor: pointer; box-shadow: 0 10px 24px rgba(255,199,44,0.45); z-index: 46; transition: transform .15s ease, box-shadow .15s ease; }
  .cc-fab-yellow:active { transform: scale(0.92); }
  .cc-toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 12.5px; font-weight: 600; z-index: 80; box-shadow: 0 6px 18px rgba(22,33,62,0.3); }
  .cc-loading { padding: 60px 20px; text-align: center; color: var(--navySoft); font-size: 14px; }

  /* ---- custom date picker (Monday-first calendar) ---- */
  .cc-date-trigger {
    width: 100%; border: 1px solid var(--border); background: var(--card); color: var(--navy);
    border-radius: 10px; padding: 11px 13px; font-size: 13.5px; font: inherit; text-align: left;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .cc-date-trigger .cal-ic { color: var(--navySoft); font-size: 13px; }
  .cc-dp-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cc-dp-navbtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--navy); font-size: 16px; cursor: pointer; transition: transform .12s ease; }
  .cc-dp-navbtn:active { transform: scale(0.9); }
  .cc-dp-navlabel { font-size: 14px; font-weight: 800; color: var(--navy); text-transform: capitalize; }
  .cc-dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cc-dp-dow { text-align: center; font-size: 10px; font-weight: 700; color: var(--navySoft); padding-bottom: 8px; }
  .cc-dp-cell {
    aspect-ratio: 1; border: none; background: none; border-radius: 50%; font-size: 13px; font-weight: 600;
    color: var(--navy); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform .1s ease;
  }
  .cc-dp-cell.empty { cursor: default; }
  .cc-dp-cell:not(.empty):active { transform: scale(0.88); background: var(--bg); }
  .cc-dp-cell.today { color: #8A6A00; font-weight: 800; box-shadow: inset 0 0 0 1.5px var(--yellow); }
  .cc-dp-cell.selected { background: var(--navy); color: #fff; }
  .cc-dp-cell.selected.today { box-shadow: none; color: #fff; }

  /* ---- Vender page ---- */
  .cc-product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 100px; }
  .cc-product-card { background: var(--card); border-radius: 14px; padding: 12px; box-shadow: 0 2px 10px rgba(22,33,62,0.06); position: relative; cursor: pointer; border: 1.5px solid transparent; text-align: left; font: inherit; transition: transform .12s ease, box-shadow .12s ease; }
  .cc-product-card:active { transform: scale(0.96); box-shadow: 0 1px 4px rgba(22,33,62,0.08); }
  .cc-product-card:active { border-color: var(--yellow); }
  .cc-product-name { font-size: 13.5px; font-weight: 700; color: var(--navy); margin: 0 0 4px; }
  .cc-product-price { font-size: 14px; font-weight: 800; color: var(--mintText); margin: 0; }
  .cc-product-stock { font-size: 11px; color: var(--navySoft); margin: 4px 0 0; }

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function toDate(dateStr) { return new Date(dateStr + "T12:00:00"); }
  function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function startOfWeek(d) { const x = startOfDay(d); const day = x.getDay(); const diff = (day === 0 ? -6 : 1) - day; x.setDate(x.getDate() + diff); return x; }
  function startOfMonth(d) { const x = startOfDay(d); x.setDate(1); return x; }
  function startOfYear(d) { const x = startOfDay(d); x.setMonth(0, 1); return x; }
  function money(n) {
    const sign = n < 0 ? "-" : "";
    const v = Math.abs(Math.round(n));

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function rangeFor(p, now) {
    if (p === "day") return [startOfDay(now), new Date(startOfDay(now).getTime() + 86400000)];
    if (p === "week") { const s = startOfWeek(now); return [s, new Date(s.getTime() + 7 * 86400000)]; }
    if (p === "month") { const s = startOfMonth(now); const e = new Date(s); e.setMonth(e.getMonth() + 1); return [s, e]; }
    const s = startOfYear(now); const e = new Date(s); e.setFullYear(e.getFullYear() + 1); return [s, e];
  }
  function rangeLabel(p, now) {
    const [s, e] = rangeFor(p, now);
    const endIncl = new Date(e.getTime() - 86400000);
    const fmt = (d) => d.toLocaleDateString("es-CO", { day: "numeric", month: "short" });
    if (p === "day") return fmt(s);
    if (p === "year") return String(s.getFullYear());
    return fmt(s) + " | " + fmt(endIncl);
  }
  function weekRangeLabel(s, endIncl, short) {
    const d1 = s.getDate(), d2 = endIncl.getDate();
    const m1 = s.toLocaleDateString("es-CO", { month: short ? "short" : "long" });
    const m2 = endIncl.toLocaleDateString("es-CO", { month: short ? "short" : "long" });
    if (m1 === m2) return short ? `${d1}-${d2} ${m1}` : `${d1} al ${d2} de ${m1}`;
    return short ? `${d1} ${m1}\n${d2} ${m2}` : `${d1} de ${m1} al ${d2} de ${m2}`;
  }

  function bucketsFor(p, now) {
    const buckets = [];
    const RANGE = 3;
    if (p === "day") {
      for (let i = -RANGE; i <= RANGE; i++) {
        const s = new Date(startOfDay(now).getTime() + i * 86400000);
        const e = new Date(s.getTime() + 86400000);
        buckets.push({ start: s, end: e, label: s.toLocaleDateString("es-CO", { weekday: "short" }) + " " + s.getDate(), current: i === 0 });
      }
    } else if (p === "week") {
      const weekStart = startOfWeek(now);
      const todayStart = startOfDay(now).getTime();
      for (let i = 0; i < 7; i++) {
        const s = new Date(weekStart.getTime() + i * 86400000);
        const e = new Date(s.getTime() + 86400000);
        buckets.push({ start: s, end: e, label: s.toLocaleDateString("es-CO", { weekday: "short" }) + " " + s.getDate(), current: s.getTime() === todayStart });
      }
    } else if (p === "month") {
      const curStart = startOfMonth(now);
      for (let i = -RANGE; i <= RANGE; i++) {
        const s = new Date(curStart);
        s.setMonth(s.getMonth() + i);
        const e = new Date(s);
        e.setMonth(e.getMonth() + 1);
        buckets.push({ start: s, end: e, label: s.toLocaleDateString("es-CO", { month: "short" }), current: i === 0 });
      }
    } else {
      const curStart = startOfYear(now);
      for (let i = -RANGE; i <= RANGE; i++) {
        const s = new Date(curStart);
        s.setFullYear(s.getFullYear() + i);
        const e = new Date(s);
        e.setFullYear(e.getFullYear() + 1);
        buckets.push({ start: s, end: e, label: String(s.getFullYear()), current: i === 0 });
      }
    }
    return buckets;
  }
  function chartCaption(p, now) {
    if (p === "day") {
      const isToday = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0") === todayStr();
      const label = now.toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" });
      return isToday ? "Hoy, " + label : "Día: " + label;
    }
    if (p === "week") {
      const s = startOfWeek(now);
      const e = new Date(s.getTime() + 6 * 86400000);
      return "Semana: " + weekRangeLabel(s, e, false);
    }
    if (p === "month") return "Mes: " + now.toLocaleDateString("es-CO", { month: "long", year: "numeric" });
    return "Año: " + now.getFullYear();
  }

  let downloadsCapPromise = null;
  function getDownloadsCapability() {
    if (!downloadsCapPromise) {
      downloadsCapPromise = (window.claude && typeof window.claude.use === "function")
        ? window.claude.use("downloads")
        : Promise.resolve(null);
    }
    return downloadsCapPromise;
  }
  function downloadErrorMessage(err) {
    const code = err && err.code;
    if (code === "declined") return "Descarga cancelada";
    if (code === "unavailable" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") {
      return "Las descargas no están disponibles aquí. Prueba abriendo esta página en tu navegador.";
    }
    if (code === "rate_limited") return "Espera un momento e inténtalo de nuevo";
    if (code === "too_large") return "El archivo es demasiado grande para descargar aquí";
    return "No se pudo generar el archivo";
  }

  function browserDownload(filename, data, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return { status: "saved" };
  }

  async function downloadJSON(obj, filename) {
    const json = JSON.stringify(obj, null, 2);
    const dl = await getDownloadsCapability();
    if (dl) return dl.save({ filename, data: json });
    return browserDownload(filename, json, "application/json;charset=utf-8;");
  }

  function chartSVG(now) {
    const buckets = bucketsFor(period, now);
    const data = buckets.map((b) => {
      let ing = 0, eg = 0;
      movimientos.forEach((m) => {
        const t = toDate(m.date).getTime();
        if (t >= b.start.getTime() && t < b.end.getTime()) { if (m.type === "ingreso") ing += m.amount; else if (m.type === "egreso") eg += m.amount; }
      });
      return { label: b.label, ing, eg, current: b.current };
    });
    const max = Math.max(1, ...data.map((d) => Math.max(d.ing, d.eg)));
    const W = 320, H = 150, padBottom = 28, padTop = 6;
    const n = data.length;
    const groupW = W / n;
    const barW = Math.min(16, groupW / 3);
    let bars = "";
    data.forEach((d, i) => {
      const cx = i * groupW + groupW / 2;
      const ingH = (d.ing / max) * (H - padTop - padBottom);
      const egH = (d.eg / max) * (H - padTop - padBottom);
      const baseY = H - padBottom;
      if (d.current) {
        bars += `<rect x="${i * groupW + 1}" y="0" width="${groupW - 2}" height="${H - padBottom}" fill="#FFF3D6" rx="6"/>`;
      }
      bars += `<rect x="${cx - barW - 2}" y="${baseY - ingH}" width="${barW}" height="${Math.max(ingH, 0.5)}" fill="#1E9E6B" rx="4"/>`;
      bars += `<rect x="${cx + 2}" y="${baseY - egH}" width="${barW}" height="${Math.max(egH, 0.5)}" fill="#E0473A" rx="4"/>`;
      const labelLines = String(d.label).includes("\n") ? d.label.split("\n") : String(d.label).split(" ");
      const lineY1 = H - 16, lineY2 = H - 6;
      const weight = d.current ? "800" : "600";
      const color = d.current ? "#16213E" : "#6B7A99";
      if (labelLines.length > 1 && String(d.label).length > 6) {
        bars += `<text x="${cx}" y="${lineY1}" font-size="9" fill="${color}" text-anchor="middle" font-weight="${weight}">${esc(labelLines[0])}</text>`;
        bars += `<text x="${cx}" y="${lineY2}" font-size="9" fill="${color}" text-anchor="middle" font-weight="${weight}">${esc(labelLines.slice(1).join(" "))}</text>`;
      } else {
        bars += `<text x="${cx}" y="${lineY2}" font-size="9.5" fill="${color}" text-anchor="middle" font-weight="${weight}">${esc(d.label)}</text>`;
      }
    });
    return `<svg class="cc-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="0" y1="${H - padBottom}" x2="${W}" y2="${H - padBottom}" stroke="#E5E8EE" />
      ${bars}
    </svg>`;
  }

  function downloadXLSX(rows, tabLabel) {
    const typeLabelsEs = { ingreso: "Ingreso", egreso: "Egreso", por_cobrar: "Por cobrar", por_pagar: "Por pagar" };
    const fmtDate = (d) => {
      const [y, m, day] = d.split("-");
      return `${day}-${m}-${y}`;
    };
    const header = ["Tipo", "Categoría", "Nota", "Medio de pago", "Fecha", "Valor"];
    const data = [header, ...rows.map((m) => [
      typeLabelsEs[m.type] || m.type, m.category, m.note || "", m.medio || "", fmtDate(m.date), m.amount,
    ])];
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = [{ wch: 12 }, { wch: 16 }, { wch: 28 }, { wch: 14 }, { wch: 12 }, { wch: 12 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, tabLabel || "Reporte");
    return wb;
  }
  async function saveXLSX(rows, tabLabel) {
    const wb = downloadXLSX(rows, tabLabel);
    const arrayBuffer = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const dl = await getDownloadsCapability();
    if (dl) return dl.save({ filename: "reporte_control.xlsx", data: arrayBuffer });
    return browserDownload("reporte_control.xlsx", arrayBuffer, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  }

  function cartTotal() {

  function renderEstadisticasContent(now) {

      byProduct[v.productId].qty += v.qty;
      byProduct[v.productId].revenue += v.subtotal;

    const topProductos = Object.values(byProduct).sort((a, b) => b.revenue - a.revenue).slice(0, 5);

  function formatDateDisplay(dateStr) {
    return toDate(dateStr).toLocaleDateString("es-CO", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }
  function getSelectedValueForTarget(target) {
    if (target === "movdate") return fDate;
    if (target === "weekdate") return selectedWeekDate;
    if (target === "daydate") return selectedDay;
    return todayStr();
  }
  function setSelectedValueForTarget(target, dateStr) {
    if (target === "movdate") fDate = dateStr;
    else if (target === "weekdate") selectedWeekDate = dateStr;
    else if (target === "daydate") selectedDay = dateStr;
  }
  function openDatePicker(target) {
    datePickerTarget = target;
    const current = toDate(getSelectedValueForTarget(target));
    datePickerViewYear = current.getFullYear();
    datePickerViewMonth = current.getMonth();
    datePickerOpen = true;
  }

  function renderDatePickerSheet() {
    if (!datePickerOpen) return `<div class="cc-overlay" id="cc-datepicker-overlay"></div><div class="cc-sheet"></div>`;
    const year = datePickerViewYear;
    const month = datePickerViewMonth;
    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = (firstOfMonth.getDay() + 6) % 7; // 0=Mon..6=Sun
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayIso = todayStr();
    const currentValue = getSelectedValueForTarget(datePickerTarget);

    let cells = "";
    for (let i = 0; i < startWeekday; i++) cells += `<div class="cc-dp-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const isToday = dateStr === todayIso;
      const isSelected = dateStr === currentValue;
      cells += `<button class="cc-dp-cell${isToday ? " today" : ""}${isSelected ? " selected" : ""}" data-dppick="${dateStr}">${d}</button>`;
    }

    return `
      <div class="cc-overlay open" id="cc-datepicker-overlay"></div>
      <div class="cc-sheet open" style="max-width:360px;">
        <div class="cc-sheet-head">
          <h3 class="cc-sheet-title">Elige una fecha</h3>
          <button class="cc-x" id="cc-datepicker-close">✕</button>
        </div>
        <div class="cc-dp-nav">
          <button class="cc-dp-navbtn" id="cc-dp-prev">‹</button>
          <span class="cc-dp-navlabel">${MONTH_NAMES[month]} ${year}</span>
          <button class="cc-dp-navbtn" id="cc-dp-next">›</button>
        </div>
        <div class="cc-dp-grid">
          <div class="cc-dp-dow">Lun</div><div class="cc-dp-dow">Mar</div><div class="cc-dp-dow">Mié</div><div class="cc-dp-dow">Jue</div><div class="cc-dp-dow">Vie</div><div class="cc-dp-dow">Sáb</div><div class="cc-dp-dow">Dom</div>
          ${cells}
        </div>
        <button class="cc-clear-link" id="cc-dp-today" style="margin-top:14px;">Ir a hoy</button>
      </div>`;
  }
