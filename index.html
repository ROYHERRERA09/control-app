      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);">
        <div class="cc-logo" style="width:52px;height:52px;font-size:24px;margin-bottom:16px;">C</div>
        <h2 style="font-size:18px;font-weight:800;color:var(--navy);margin:0 0 6px;">Control está bloqueado</h2>
        <p style="font-size:12.5px;color:var(--navySoft);margin:0 0 20px;">Ingresa tu PIN para continuar</p>
        <input class="cc-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="cc-lock-pin" placeholder="••••" style="text-align:center;font-size:22px;letter-spacing:10px;max-width:160px;margin-bottom:10px;" />
        ${lockError ? `<p class="cc-error">${esc(lockError)}</p>` : ""}
        <button class="cc-submit" id="cc-unlock-btn" style="max-width:220px;">Desbloquear</button>
        <p style="font-size:11px;color:var(--navySoft);margin-top:20px;max-width:260px;">¿Olvidaste tu PIN? Por seguridad no se puede recuperar. Deberás borrar los datos de esta app desde la configuración de tu navegador para reiniciarla.</p>
      </div>`;
  }
  function wireLockEvents() {
    const input = document.getElementById("cc-lock-pin");
    if (input) {
      input.focus();
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptUnlock(); });
    }
    const btn = document.getElementById("cc-unlock-btn");
    if (btn) btn.addEventListener("click", attemptUnlock);
  }
  function attemptUnlock() {
    const val = document.getElementById("cc-lock-pin").value;
    if (val && val === settings.pin) {
      sessionLocked = false; lockError = ""; lockPinInput = "";
      render();
    } else {
      lockError = "PIN incorrecto.";
      render();
    }
  }

  function renderExportDialogSheet() {
    const tabLabels = { ingreso: "Ingresos", egreso: "Egresos", por_cobrar: "Por cobrar", por_pagar: "Por pagar" };
    return `
      <div class="cc-overlay${showExportDialog ? " open" : ""}" id="cc-export-overlay"></div>
      <div class="cc-sheet${showExportDialog ? " open" : ""}">
        <div class="cc-sheet-head">
          <h3 class="cc-sheet-title">Exportar reporte</h3>
          <button class="cc-x" id="cc-export-close">✕</button>
        </div>
        <p style="font-size:12.5px;color:var(--navySoft);margin:0 0 16px;">Se exportarán tus movimientos de <b>${tabLabels[tab]}</b>. ¿De qué período?</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="cc-btn-outline" data-exportperiod="week" style="width:100%;">Esta semana</button>
          <button class="cc-btn-outline" data-exportperiod="month" style="width:100%;">Este mes</button>
          <button class="cc-btn-outline" data-exportperiod="year" style="width:100%;">Este año</button>
        </div>
      </div>`;
  }

  function pctChange(curr, prev) {
    if (prev === 0) return curr === 0 ? 0 : 100;
    return ((curr - prev) / Math.abs(prev)) * 100;
  }

  function renderHomeContent(now) {
    const todayStart = startOfDay(now);
    const todayEnd = new Date(todayStart.getTime() + 86400000);
    const yestStart = new Date(todayStart.getTime() - 86400000);
    const yestEnd = todayStart;

    const inRange = (dateStr, s, e) => { const t = toDate(dateStr).getTime(); return t >= s.getTime() && t < e.getTime(); };

    const ventasHoy = movimientos.filter((m) => m.type === "ingreso" && inRange(m.date, todayStart, todayEnd)).reduce((a, m) => a + m.amount, 0);
    const ventasAyer = movimientos.filter((m) => m.type === "ingreso" && inRange(m.date, yestStart, yestEnd)).reduce((a, m) => a + m.amount, 0);
    const gastosHoy = movimientos.filter((m) => m.type === "egreso" && inRange(m.date, todayStart, todayEnd)).reduce((a, m) => a + m.amount, 0);
    const balanceHoy = ventasHoy - gastosHoy;
    const cambio = pctChange(ventasHoy, ventasAyer);

    // month stats
    const monthStart = startOfMonth(now);
    const monthEnd = new Date(monthStart); monthEnd.setMonth(monthEnd.getMonth() + 1);
    const prevMonthStart = new Date(monthStart); prevMonthStart.setMonth(prevMonthStart.getMonth() - 1);
    const prevMonthEnd = monthStart;

    const gananciaMes = movimientos.filter((m) => inRange(m.date, monthStart, monthEnd) && (m.type === "ingreso" || m.type === "egreso"))
      .reduce((a, m) => a + (m.type === "ingreso" ? m.amount : -m.amount), 0);
    const gananciaMesPrev = movimientos.filter((m) => inRange(m.date, prevMonthStart, prevMonthEnd) && (m.type === "ingreso" || m.type === "egreso"))
      .reduce((a, m) => a + (m.type === "ingreso" ? m.amount : -m.amount), 0);
    const gananciaCambio = pctChange(gananciaMes, gananciaMesPrev);

    const ventasDetalleMes = ventasDetalle.filter((v) => inRange(v.date, monthStart, monthEnd));
    const byProd = {};
    ventasDetalleMes.forEach((v) => {
      if (!byProd[v.productId]) byProd[v.productId] = { name: v.name, revenue: 0 };
      byProd[v.productId].revenue += v.subtotal;
    });
    const topProd = Object.values(byProd).sort((a, b) => b.revenue - a.revenue)[0];

    const carouselItems = [
      { key: "estadisticas", icon: "📈", label: "Estadísticas" },
      { key: "inventario", icon: "📦", label: "Inventario" },
      { key: "clientes", icon: "👤", label: "Clientes" },
      { key: "proveedores", icon: "🚚", label: "Proveedores" },
      { key: "vender", icon: "🏷", label: "Vender" },
    ];

    return `
      <div class="cc-home-hero">
        <div class="cc-home-hero-top">
          <div class="cc-home-hero-main">
            <p class="cc-home-hero-label">Tu negocio hoy</p>
            <p class="cc-home-hero-amount">${money(ventasHoy)}</p>
          </div>
          <span class="cc-home-vs ${cambio >= 0 ? "up" : "down"}">${cambio >= 0 ? "↑" : "↓"} ${Math.abs(cambio).toFixed(1)}%</span>
        </div>
        <p style="font-size:11px;color:var(--navySoft);margin:0;">Ventas hoy vs. ayer</p>

        <div class="cc-home-split">
          <div class="cc-home-split-col">
            <p class="cc-home-split-amount" style="color:${balanceHoy < 0 ? "var(--coralText)" : "var(--mintText)"}">${money(balanceHoy)}</p>
            <p class="cc-home-split-label">Balance</p>
          </div>
          <div class="cc-home-split-col">
            <p class="cc-home-split-amount" style="color:var(--coralText)">${money(gastosHoy)}</p>
            <p class="cc-home-split-label">Gastos hoy</p>
          </div>
        </div>

        <button class="cc-home-cta" id="cc-home-registrar-venta">+ Registrar venta</button>
      </div>

      <p class="cc-home-section-title">Descubre todo lo que puedes hacer</p>
      <div class="cc-home-carousel">
        ${carouselItems.map((c) => `
          <button class="cc-home-card" data-homenav="${c.key}">
            <div class="cc-home-card-icon">${c.icon}</div>
            <div class="cc-home-card-label">${esc(c.label)}</div>
          </button>`).join("")}
      </div>

      <div class="cc-card" style="margin-bottom:24px;">
        <p class="cc-card-label">📊 Estadísticas</p>
        <div class="cc-home-stats-row">
          <div class="cc-home-stat-card">
            <p class="cc-home-stat-title">Producto estrella del mes</p>
            <p class="cc-home-stat-value">${topProd ? esc(topProd.name) : "Sin datos"}</p>
            <p class="cc-home-stat-sub">${topProd ? money(topProd.revenue) : money(0)}</p>
          </div>
          <div class="cc-home-stat-card">
            <p class="cc-home-stat-title">Ganancias del mes</p>
            <p class="cc-home-stat-value" style="color:${gananciaMes < 0 ? "var(--coralText)" : "var(--navy)"}">${money(gananciaMes)}</p>
            <p class="cc-home-stat-sub" style="color:${gananciaCambio >= 0 ? "var(--mintText)" : "var(--coralText)"}">${gananciaCambio >= 0 ? "↑" : "↓"} ${Math.abs(gananciaCambio).toFixed(1)}% vs. mes anterior</p>
          </div>
        </div>
        <button class="cc-home-viewall" id="cc-home-viewall-stats">👁 Ver todo →</button>
      </div>
    `;
  }

  function renderDeudasContent() {
    const totalPorCobrar = clientes.reduce((sum, c) => sum + Math.max(0, clienteBalance(c.id)), 0);
    const totalPorPagar = proveedores.reduce((sum, p) => sum + Math.max(0, proveedorBalance(p.id)), 0);
    const clientesConDeuda = clientes.filter((c) => clienteBalance(c.id) > 0).length;
    const proveedoresConDeuda = proveedores.filter((p) => proveedorBalance(p.id) > 0).length;

    return `
      <div class="cc-stats" style="margin-bottom:20px;">
        <div class="cc-stat">
          <div class="cc-stat-icon coral">◔</div>
          <p class="cc-stat-label">Por cobrar</p>
          <p class="cc-stat-amount" style="color:var(--coralText)">${money(totalPorCobrar)}</p>
        </div>
        <div class="cc-stat">
          <div class="cc-stat-icon navy">◔</div>
          <p class="cc-stat-label">Por pagar</p>
          <p class="cc-stat-amount">${money(totalPorPagar)}</p>
        </div>
      </div>

      <div class="cc-card" style="cursor:pointer;" data-homenav="clientes">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="cc-stat-icon coral" style="width:40px;height:40px;font-size:18px;">👤</div>
          <div style="flex:1;">
            <p style="font-size:14px;font-weight:800;color:var(--navy);margin:0 0 2px;">Clientes</p>
            <p style="font-size:11.5px;color:var(--navySoft);margin:0;">${clientesConDeuda} ${clientesConDeuda === 1 ? "cliente te debe" : "clientes te deben"}</p>
          </div>
          <span style="color:var(--navySoft);">›</span>
        </div>
      </div>

      <div class="cc-card" style="cursor:pointer;" data-homenav="proveedores">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="cc-stat-icon navy" style="width:40px;height:40px;font-size:18px;">🚚</div>
          <div style="flex:1;">
            <p style="font-size:14px;font-weight:800;color:var(--navy);margin:0 0 2px;">Proveedores</p>
            <p style="font-size:11.5px;color:var(--navySoft);margin:0;">${proveedoresConDeuda} ${proveedoresConDeuda === 1 ? "proveedor por pagar" : "proveedores por pagar"}</p>
          </div>
          <span style="color:var(--navySoft);">›</span>
        </div>
      </div>
    `;
  }

  function render() {
    const root = document.getElementById("cc-root");
    if (!loaded || !productosLoaded || !ventasDetalleLoaded || !clientesLoaded || !clienteMovLoaded || !proveedoresLoaded || !proveedorMovLoaded || !settingsLoaded) {
      root.innerHTML = '<div class="cc-loading">Cargando tu caja…</div>';
      return;
    }
    if (sessionLocked) {
      root.innerHTML = renderLockScreenHTML();
      wireLockEvents();
      return;
    }
    const now = new Date();
    const periodRef = period === "year" ? new Date(selectedYear, now.getMonth(), now.getDate())
      : period === "month" ? new Date(selectedYear, selectedMonth, 1)
      : period === "week" ? toDate(selectedWeekDate)
      : period === "day" ? toDate(selectedDay)
      : now;
    const [s, e] = rangeFor(period, periodRef);
    const enPeriodo = movimientos.filter((m) => { const t = toDate(m.date).getTime(); return t >= s.getTime() && t < e.getTime(); });
    const ing = enPeriodo.filter((m) => m.type === "ingreso").reduce((a, m) => a + m.amount, 0);
    const eg = enPeriodo.filter((m) => m.type === "egreso").reduce((a, m) => a + m.amount, 0);
    const porCobrar = enPeriodo.filter((m) => m.type === "por_cobrar").reduce((a, m) => a + m.amount, 0);
    const porPagar = enPeriodo.filter((m) => m.type === "por_pagar").reduce((a, m) => a + m.amount, 0);
    const balance = ing - eg;

    let lista = enPeriodo.filter((m) => m.type === tab);
    if (filterCategory) lista = lista.filter((m) => m.category === filterCategory);
    if (search.trim()) {
      const qq = search.trim().toLowerCase();
      lista = lista.filter((m) => (m.category + " " + (m.note || "")).toLowerCase().includes(qq));
    }
    lista = lista.sort((a, b) => toDate(b.date) - toDate(a.date) || b.createdAt - a.createdAt);

    const periodOptions = PERIODS.map((p) => `<option value="${p.key}" ${p.key === period ? "selected" : ""}>${p.label}</option>`).join("");
    const currentYearNow = now.getFullYear();
    const yearOptions = Array.from({ length: 7 }, (_, i) => currentYearNow - 6 + i)
      .map((y) => `<option value="${y}" ${y === selectedYear ? "selected" : ""}>${y}</option>`).join("");
    const monthOptions = MONTH_NAMES.map((name, i) => `<option value="${i}" ${i === selectedMonth ? "selected" : ""}>${name}</option>`).join("");

    const catForTab = CATS[tab];
    const catFilterHTML = showFilterPanel
      ? `<div class="cc-cat-filter-row">${catForTab.map((c) => `<button class="cc-cat-chip${filterCategory === c ? " active" : ""}" data-catfilter="${esc(c)}">${esc(c)}</button>`).join("")}</div>`
      : "";

    const listHTML = lista.length === 0
      ? `<div class="cc-empty">No hay movimientos en este período. Toca "+ Agregar" para registrar el primero.</div>`
      : `<ul class="cc-list">${lista.map((m) => {
          const bc = badgeColors(m.type);
          const time = new Date(m.createdAt).toLocaleTimeString("es-CO", { hour: "numeric", minute: "2-digit" });
          return `
        <li class="cc-row">
          <div class="cc-row-left">
            <div class="cc-badge" style="background:${bc.bg};color:${bc.fg}">${bc.icon}</div>
            <div style="min-width:0">
              <p class="cc-row-cat">${esc(m.category)}</p>
              <p class="cc-row-meta">${m.medio ? esc(m.medio) + " · " : ""}${toDate(m.date).toLocaleDateString("es-CO", { day: "numeric", month: "short" })} · ${time}${m.note ? " · " + esc(m.note) : ""}</p>
            </div>
          </div>
          <div class="cc-row-right">
            <span class="cc-amount" style="color:${bc.fg}">${money(m.amount)}</span>
            <button class="cc-del" data-editmov="${m.id}" title="Editar">✎</button>
            <button class="cc-del" data-del="${m.id}">✕</button>
          </div>
        </li>`;
        }).join("")}</ul>`;

    const clearHTML = movimientos.length === 0 ? "" : (
      !confirmClear
        ? `<button class="cc-clear-link" id="cc-clear-start">Borrar todos los movimientos</button>`
        : `<div class="cc-confirm">
            <span>¿Seguro? Esto no se puede deshacer.</span>
            <button style="color:var(--coralText)" id="cc-clear-yes">Sí, borrar todo</button>
            <button style="color:var(--navySoft)" id="cc-clear-no">Cancelar</button>
          </div>`
    );

    const catOptions = CATS[fType];
    const chipsHTML = catOptions.map((c) => `<button class="cc-chip${fCategory === c ? " active" : ""}" data-chip="${esc(c)}">${esc(c)}</button>`).join("");
    const medioOptions = MEDIOS.map((m) => `<option value="${m}" ${m === fMedio ? "selected" : ""}>${m}</option>`).join("");
    const typeLabels = { ingreso: "Ingreso", egreso: "Egreso", por_cobrar: "Por cobrar", por_pagar: "Por pagar" };
    const typeBtnsHTML = TABS.map((t2) => `<button class="cc-type-btn${fType === t2.key ? " active-" + t2.key : ""}" data-type="${t2.key}">${t2.label}</button>`).join("");

    let pendingHTML = "";
    if (tab === "por_cobrar") pendingHTML = `<div class="cc-pending-total">Total por cobrar en el período <span>${money(porCobrar)}</span></div>`;
    if (tab === "por_pagar") pendingHTML = `<div class="cc-pending-total pagar">Total por pagar en el período <span>${money(porPagar)}</span></div>`;

    let pageTitle = "Balance";
    let headerActionsHTML = "";
    let pageBodyHTML = "";

    if (page === "balance") {
      headerActionsHTML = `
      <button class="cc-btn-navy" id="cc-caja-btn">${cajaAbierta ? "Cerrar caja" : "Abrir caja"}</button>
      <button class="cc-btn-outline" id="cc-download-btn">Descargar reporte</button>`;
      pageBodyHTML = `
      <div class="cc-filter-row">
        <button class="cc-filter-btn${showFilterPanel ? " on" : ""}" id="cc-filter-toggle">⚙ Filtrar</button>
        <div class="cc-select-wrap">
          <select class="cc-select" id="cc-period">${periodOptions}</select>
          <span class="cc-select-chevron">▾</span>
        </div>
      </div>
      ${period === "year" ? `
      <div class="cc-filter-row">
        <div class="cc-select-wrap">
          <select class="cc-select" id="cc-year">${yearOptions}</select>
          <span class="cc-select-chevron">▾</span>
        </div>
      </div>` : ""}
      ${period === "month" ? `
      <div class="cc-filter-row">
        <div class="cc-select-wrap" style="flex:1.4;">
          <select class="cc-select" id="cc-month">${monthOptions}</select>
          <span class="cc-select-chevron">▾</span>
        </div>
        <div class="cc-select-wrap">
          <select class="cc-select" id="cc-year">${yearOptions}</select>
          <span class="cc-select-chevron">▾</span>
        </div>
      </div>` : ""}
      ${period === "week" ? `
      <div class="cc-filter-row">
        <div class="cc-select-wrap" style="flex:none;width:100%;">
          <button type="button" class="cc-date-trigger" id="cc-weekdate">${formatDateDisplay(selectedWeekDate)}<span class="cal-ic">📅</span></button>
        </div>
      </div>` : ""}
      ${period === "day" ? `
      <div class="cc-filter-row">
        <div class="cc-select-wrap" style="flex:none;width:100%;">
          <button type="button" class="cc-date-trigger" id="cc-daydate">${formatDateDisplay(selectedDay)}<span class="cal-ic">📅</span></button>
        </div>
      </div>` : ""}
      <div class="cc-filter-row">
        <div class="cc-range-pill">📅 ${rangeLabel(period, periodRef)}</div>
      </div>
      ${catFilterHTML}

      <div class="cc-search-wrap">
        <span class="cc-search-icon">🔍</span>
        <input class="cc-search" id="cc-search" placeholder="Buscar concepto..." value="${esc(search)}" />
      </div>

      <div class="cc-stats">
        <div class="cc-stat">
          <div class="cc-stat-icon navy">↕</div>
          <p class="cc-stat-label">Balance</p>
          <p class="cc-stat-amount" style="color:${balance < 0 ? "var(--coralText)" : "var(--navy)"}">${money(balance)}</p>
        </div>
        <div class="cc-stat">
          <div class="cc-stat-icon mint">↑</div>
          <p class="cc-stat-label">Ingresos</p>
          <p class="cc-stat-amount" style="color:var(--mintText)">${money(ing)}</p>
        </div>
        <div class="cc-stat">
          <div class="cc-stat-icon coral">↓</div>
          <p class="cc-stat-label">Egresos</p>
          <p class="cc-stat-amount" style="color:var(--coralText)">${money(eg)}</p>
        </div>
      </div>

      <div class="cc-card">
        <p class="cc-card-label">${chartCaption(period, periodRef)}</p>
        ${chartSVG(periodRef)}
      </div>

      <div class="cc-tabs">
        ${TABS.map((t2) => `<button class="cc-tab${tab === t2.key ? " active" : ""}" data-tab="${t2.key}">${t2.label}</button>`).join("")}
      </div>
      ${pendingHTML}
      <div class="cc-count-row"><span class="cc-count">${lista.length} ${lista.length === 1 ? "registro" : "registros"}</span></div>

      ${listHTML}

      <div style="margin-bottom:16px">${clearHTML}</div>
    `;
    } else if (page === "home") {
      pageTitle = "Inicio";
      headerActionsHTML = "";
      pageBodyHTML = renderHomeContent(now);
    } else if (page === "deudas") {
      pageTitle = "Deudas";
      headerActionsHTML = "";
      pageBodyHTML = renderDeudasContent();
    } else if (page === "vender") {
      pageTitle = "Vender";
      headerActionsHTML = `<button class="cc-btn-outline" id="cc-new-product" style="flex:none; padding-left:18px; padding-right:18px;">+ Nuevo producto</button>`;
      pageBodyHTML = renderVenderContent();
    } else if (page === "estadisticas") {
      pageTitle = "Estadísticas";
      headerActionsHTML = `<button class="cc-btn-outline" id="cc-stats-settings" style="flex:none;width:38px;padding:9px;margin-left:auto;">⚙</button>`;
      pageBodyHTML = renderEstadisticasContent(now);
    } else if (page === "inventario") {
      pageTitle = "Inventario";
      headerActionsHTML = `<button class="cc-btn-outline" id="cc-new-product" style="flex:none;padding-left:18px;padding-right:18px;margin-left:auto;">+ Nuevo producto</button>`;
      pageBodyHTML = renderInventarioContent();
    } else if (page === "clientes") {
      pageTitle = "Clientes";
      headerActionsHTML = `<button class="cc-btn-outline" id="cc-new-client" style="flex:none;padding-left:18px;padding-right:18px;margin-left:auto;">+ Nuevo cliente</button>`;
      pageBodyHTML = renderClientesContent();
    } else if (page === "proveedores") {
      pageTitle = "Proveedores";
      headerActionsHTML = `<button class="cc-btn-outline" id="cc-new-proveedor" style="flex:none;padding-left:18px;padding-right:18px;margin-left:auto;">+ Nuevo proveedor</button>`;
      pageBodyHTML = renderProveedoresContent();
    } else if (page === "config") {
      pageTitle = "Configuraciones";
      headerActionsHTML = "";
      pageBodyHTML = renderConfiguracionesContent();
    } else if (page === "ayuda") {
      pageTitle = "Ayuda";
      headerActionsHTML = "";
      pageBodyHTML = renderAyudaContent();
    }

    root.innerHTML = `
      ${renderSidebar()}

      <div class="cc-wrap">
        <div class="cc-topbar">
          <button class="cc-hamburger" id="cc-hamburger">☰</button>
          <h1 class="cc-page-title">${pageTitle}</h1>
        </div>

        <div class="cc-header-actions">${headerActionsHTML}</div>

        ${pageBodyHTML}
      </div>

      <div class="cc-overlay${showForm ? " open" : ""}" id="cc-overlay"></div>
      <div class="cc-sheet${showForm ? " open" : ""}">
        <div class="cc-sheet-head">
          <h3 class="cc-sheet-title">${editingMovimientoId ? "Editar movimiento" : "Nuevo movimiento"}</h3>
          <button class="cc-x" id="cc-close">✕</button>
        </div>
        <div class="cc-type-row">${typeBtnsHTML}</div>
        <label class="cc-label">Monto</label>
        <input class="cc-input amount" type="number" inputmode="decimal" id="cc-amount" placeholder="0" value="${esc(fAmount)}" />
        <label class="cc-label">Categoría</label>
        <div class="cc-chips">${chipsHTML}</div>
        <input class="cc-input" type="text" id="cc-category" placeholder="O escribe una categoría" value="${esc(fCategory)}" />
        <label class="cc-label">Medio de pago</label>
        <select class="cc-input" id="cc-medio">${medioOptions}</select>
        <label class="cc-label">Fecha</label>
        <button type="button" class="cc-date-trigger" id="cc-date" style="margin-bottom:14px;">${formatDateDisplay(fDate)}<span class="cal-ic">📅</span></button>
        <label class="cc-label">Nota (opcional)</label>
        <input class="cc-input" type="text" id="cc-note" placeholder="Ej. Venta mostrador" value="${esc(fNote)}" />
        ${errorMsg ? `<p class="cc-error">${esc(errorMsg)}</p>` : ""}
        <button class="cc-submit" id="cc-submit">${editingMovimientoId ? "Guardar cambios" : "Guardar " + typeLabels[fType].toLowerCase()}</button>
      </div>

      ${renderCheckoutSheet()}
      ${renderProductFormSheet()}
      ${renderExportDialogSheet()}
      ${renderClientFormSheet()}
      ${renderClienteDetailSheet()}
      ${renderProveedorFormSheet()}
      ${renderProveedorDetailSheet()}
      ${renderProfileEditSheet()}
      ${renderDatePickerSheet()}

      <div class="cc-bottomnav">
        ${BOTTOM_NAV.map((b) => `
          <button class="cc-bottomnav-item${page === b.key ? " active" : ""}" data-bottomnav="${b.key}">
            <span class="cc-bottomnav-icon">${b.icon}</span>${b.label}
          </button>`).join("")}
      </div>

      ${page !== "vender" && page !== "home" && page !== "deudas" ? '<button class="cc-fab-yellow" id="cc-fab">+</button>' : ""}

      ${toast ? `<div class="cc-toast">${esc(toast)}</div>` : ""}
    `;

    wireEvents();
  }

  function renderCheckoutSheet() {
    const items = Object.entries(cart).map(([id, qty]) => {
      const p = productos.find((x) => x.id === id);
      return p ? { p, qty } : null;
    }).filter(Boolean);
    const itemsHTML = items.length === 0
      ? `<p style="color:var(--navySoft);font-size:13px;">Tu carrito está vacío.</p>`
      : items.map(({ p, qty }) => `
        <div class="cc-checkout-item">
          <div>
            <p class="cc-checkout-item-name">${esc(p.name)}</p>
            <p class="cc-checkout-item-sub">${money(p.price)} c/u</p>
          </div>
          <div class="cc-qty-stepper">
            <button class="cc-qty-btn" data-qtydec="${p.id}">−</button>
            <span class="cc-qty-val">${qty}</span>
            <button class="cc-qty-btn" data-qtyinc="${p.id}">+</button>
          </div>
        </div>`).join("");
    const medioOptionsHTML = MEDIOS.map((m) => `<option value="${m}" ${m === ventaMedio ? "selected" : ""}>${m}</option>`).join("");

    return `
      <div class="cc-overlay${showCheckout ? " open" : ""}" id="cc-checkout-overlay"></div>
      <div class="cc-sheet${showCheckout ? " open" : ""}">
        <div class="cc-sheet-head">
          <h3 class="cc-sheet-title">Confirmar venta</h3>
          <button class="cc-x" id="cc-checkout-close">✕</button>
        </div>
        ${itemsHTML}
        <div class="cc-checkout-total-row"><span>Total</span><span>${money(cartTotal())}</span></div>
        <label class="cc-label" style="margin-top:10px;">Medio de pago</label>
        <select class="cc-input" id="cc-venta-medio">${medioOptionsHTML}</select>
        ${ventaError ? `<p class="cc-error">${esc(ventaError)}</p>` : ""}
        <button class="cc-submit" id="cc-confirm-venta">Confirmar venta</button>
      </div>`;
  }

  function renderProductFormSheet() {
    return `
      <div class="cc-overlay${showProductForm ? " open" : ""}" id="cc-product-overlay"></div>
      <div class="cc-sheet${showProductForm ? " open" : ""}">
        <div class="cc-sheet-head">
          <h3 class="cc-sheet-title">${editingProductId ? "Editar producto" : "Nuevo producto"}</h3>
          <button class="cc-x" id="cc-product-close">✕</button>
        </div>
        <label class="cc-label">Nombre</label>
        <input class="cc-input" type="text" id="cc-p-name" placeholder="Ej. Café americano" value="${esc(pFormName)}" />
        <label class="cc-label">Precio</label>
        <input class="cc-input amount" type="number" inputmode="decimal" id="cc-p-price" placeholder="0" value="${esc(pFormPrice)}" />
        <label class="cc-label">Stock (opcional)</label>
        <input class="cc-input" type="number" inputmode="numeric" id="cc-p-stock" placeholder="Déjalo vacío si no llevas inventario" value="${esc(pFormStock)}" />
        ${errorMsg && showProductForm ? `<p class="cc-error">${esc(errorMsg)}</p>` : ""}
        <button class="cc-submit" id="cc-save-product">${editingProductId ? "Guardar cambios" : "Guardar producto"}</button>
      </div>`;
  }

  function resetForm() {
    fType = tab === "ingreso" || tab === "egreso" ? tab : "ingreso";
    fAmount = ""; fCategory = ""; fMedio = "Efectivo"; fNote = ""; fDate = todayStr(); errorMsg = "";
    editingMovimientoId = null;
  }
  function resetProductForm() {
    pFormName = ""; pFormPrice = ""; pFormStock = ""; errorMsg = ""; editingProductId = null;
  }

  function wireEvents() {
    const root = document.getElementById("cc-root");

    const hamburger = document.getElementById("cc-hamburger");
    if (hamburger) hamburger.addEventListener("click", () => { sidebarOpen = true; render(); });
    const sbOverlay = document.getElementById("cc-sb-overlay");
    if (sbOverlay) sbOverlay.addEventListener("click", () => { sidebarOpen = false; render(); });
    const sbClose = document.getElementById("cc-sb-close");
    if (sbClose) sbClose.addEventListener("click", () => { sidebarOpen = false; render(); });

    function goToPage(key) {
      sidebarOpen = false;
      const validPages = ["home", "balance", "deudas", "vender", "estadisticas", "inventario", "clientes", "proveedores", "config", "ayuda"];
      if (validPages.includes(key)) {
        if (key === "config") {
          cfgBusinessName = settings.businessName || "";
          cfgOwnerName = settings.ownerName || "";
          cfgCurrency = settings.currency || "$";
        }
        page = key; render(); return;
      }
      if (key === "logout") {
        if (!settings.pin) { showToast("Activa un PIN en Configuraciones para poder bloquear la app"); return; }
        sessionLocked = true; lockPinInput = ""; lockError = ""; render(); return;
      }
      showToast("Esta sección no está incluida en esta versión personal");
    }

    root.querySelectorAll("[data-nav]").forEach((btn) => {
      btn.addEventListener("click", () => goToPage(btn.getAttribute("data-nav")));
    });

    root.querySelectorAll("[data-bottomnav]").forEach((btn) => {
      btn.addEventListener("click", () => goToPage(btn.getAttribute("data-bottomnav")));
    });

    root.querySelectorAll("[data-homenav]").forEach((btn) => {
      btn.addEventListener("click", () => goToPage(btn.getAttribute("data-homenav")));
    });

    const homeRegistrarVenta = document.getElementById("cc-home-registrar-venta");
    if (homeRegistrarVenta) homeRegistrarVenta.addEventListener("click", () => goToPage("vender"));
    const homeViewAllStats = document.getElementById("cc-home-viewall-stats");
    if (homeViewAllStats) homeViewAllStats.addEventListener("click", () => goToPage("estadisticas"));

    const editProfileBtn = document.getElementById("cc-sb-edit-profile");
    if (editProfileBtn) editProfileBtn.addEventListener("click", () => {
      cfgBusinessName = settings.businessName || "";
      cfgOwnerName = settings.ownerName || "";
      sidebarOpen = false;
      showProfileEditSheet = true;
      render();
    });
    const profileEditOverlay = document.getElementById("cc-profile-edit-overlay");
    if (profileEditOverlay) profileEditOverlay.addEventListener("click", () => { showProfileEditSheet = false; render(); });
    const profileEditClose = document.getElementById("cc-profile-edit-close");
    if (profileEditClose) profileEditClose.addEventListener("click", () => { showProfileEditSheet = false; render(); });
    const saveProfileEditBtn = document.getElementById("cc-save-profile-edit");
    if (saveProfileEditBtn) saveProfileEditBtn.addEventListener("click", () => {
      const businessVal = document.getElementById("cc-pf-business").value.trim();
      const ownerVal = document.getElementById("cc-pf-owner").value.trim();
      settings.businessName = businessVal || "Mi negocio";
      settings.ownerName = ownerVal || "Propietario";
      saveSettings();
      showProfileEditSheet = false;
      showToast("Perfil actualizado");
      render();
    });

    const cajaBtn = document.getElementById("cc-caja-btn");
    if (cajaBtn) cajaBtn.addEventListener("click", () => {
      cajaAbierta = !cajaAbierta;
      showToast(cajaAbierta ? "Caja abierta" : "Caja cerrada");
    });

    const downloadBtn = document.getElementById("cc-download-btn");
    if (downloadBtn) downloadBtn.addEventListener("click", () => { showExportDialog = true; render(); });

    const exportOverlay = document.getElementById("cc-export-overlay");
    if (exportOverlay) exportOverlay.addEventListener("click", () => { showExportDialog = false; render(); });
    const exportClose = document.getElementById("cc-export-close");
    if (exportClose) exportClose.addEventListener("click", () => { showExportDialog = false; render(); });

    root.querySelectorAll("[data-exportperiod]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const chosenPeriod = btn.getAttribute("data-exportperiod");
        const now = new Date();
        const [s, e] = rangeFor(chosenPeriod, now);
        const rows = movimientos.filter((m) => { const t = toDate(m.date).getTime(); return t >= s.getTime() && t < e.getTime() && m.type === tab; });
        showExportDialog = false;
        render();
        if (rows.length === 0) { showToast("No hay datos para exportar en ese período"); return; }
        try {
          const result = await saveXLSX(rows);
          showToast(result && result.status === "delivered" ? "Reporte enviado" : "Reporte descargado");
        } catch (err) {
          showToast(downloadErrorMessage(err));
        }
      });
    });

    const filterToggle = document.getElementById("cc-filter-toggle");
    if (filterToggle) filterToggle.addEventListener("click", () => { showFilterPanel = !showFilterPanel; render(); });

    root.querySelectorAll("[data-catfilter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const c = btn.getAttribute("data-catfilter");
        filterCategory = filterCategory === c ? null : c;
        render();
      });
    });

    const periodSel = document.getElementById("cc-period");
    if (periodSel) periodSel.addEventListener("change", () => { period = periodSel.value; render(); });

    const yearSel = document.getElementById("cc-year");
    if (yearSel) yearSel.addEventListener("change", () => { selectedYear = parseInt(yearSel.value, 10); render(); });

    const monthSel = document.getElementById("cc-month");
    if (monthSel) monthSel.addEventListener("change", () => { selectedMonth = parseInt(monthSel.value, 10); render(); });

    const searchInput = document.getElementById("cc-search");
    if (searchInput) searchInput.addEventListener("input", () => {
      search = searchInput.value; render();
      const el = document.getElementById("cc-search");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });

    const productSearchInput = document.getElementById("cc-product-search");
    if (productSearchInput) productSearchInput.addEventListener("input", () => {
      productSearch = productSearchInput.value; render();
      const el = document.getElementById("cc-product-search");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });

    root.querySelectorAll("[data-tab]").forEach((btn) => {
      btn.addEventListener("click", () => { tab = btn.getAttribute("data-tab"); filterCategory = null; showFilterPanel = false; render(); });
    });

    root.querySelectorAll("[data-del]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-del");
        movimientos = movimientos.filter((m) => m.id !== id);
        saveData(); render();
      });
    });

    root.querySelectorAll("[data-editmov]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const m = movimientos.find((x) => x.id === btn.getAttribute("data-editmov"));
        if (!m) return;
        editingMovimientoId = m.id;
        fType = m.type;
        fAmount = String(m.amount);
        fCategory = m.category;
        fMedio = m.medio || "Efectivo";
        fNote = m.note || "";
        fDate = m.date;
        errorMsg = "";
        showForm = true;
        render();
      });
    });

    const clearStart = document.getElementById("cc-clear-start");
    if (clearStart) clearStart.addEventListener("click", () => { confirmClear = true; render(); });
    const clearYes = document.getElementById("cc-clear-yes");
    if (clearYes) clearYes.addEventListener("click", () => { movimientos = []; confirmClear = false; saveData(); render(); });
    const clearNo = document.getElementById("cc-clear-no");
    if (clearNo) clearNo.addEventListener("click", () => { confirmClear = false; render(); });

    const fab = document.getElementById("cc-fab");
    if (fab) fab.addEventListener("click", () => { resetForm(); showForm = true; render(); });

    const overlay = document.getElementById("cc-overlay");
    if (overlay) overlay.addEventListener("click", () => { showForm = false; render(); });
    const closeBtn = document.getElementById("cc-close");
    if (closeBtn) closeBtn.addEventListener("click", () => { showForm = false; render(); });

    root.querySelectorAll("[data-type]").forEach((btn) => {
      btn.addEventListener("click", () => {
        fType = btn.getAttribute("data-type"); fCategory = "";
        fAmount = document.getElementById("cc-amount").value;
        fNote = document.getElementById("cc-note").value;
        fMedio = document.getElementById("cc-medio").value;
        render();
      });
    });

    root.querySelectorAll("[data-chip]").forEach((btn) => {
      btn.addEventListener("click", () => {
        fCategory = btn.getAttribute("data-chip");
        fAmount = document.getElementById("cc-amount").value;
        fNote = document.getElementById("cc-note").value;
        fMedio = document.getElementById("cc-medio").value;
        render();
      });
    });

    const ccDateTrigger = document.getElementById("cc-date");
    if (ccDateTrigger) ccDateTrigger.addEventListener("click", () => { openDatePicker("movdate"); render(); });

    const weekDateBtn = document.getElementById("cc-weekdate");
    if (weekDateBtn) weekDateBtn.addEventListener("click", () => { openDatePicker("weekdate"); render(); });

    const dayDateBtn = document.getElementById("cc-daydate");
    if (dayDateBtn) dayDateBtn.addEventListener("click", () => { openDatePicker("daydate"); render(); });

    const dpOverlay = document.getElementById("cc-datepicker-overlay");
    if (dpOverlay) dpOverlay.addEventListener("click", () => { datePickerOpen = false; render(); });
    const dpClose = document.getElementById("cc-datepicker-close");
    if (dpClose) dpClose.addEventListener("click", () => { datePickerOpen = false; render(); });

    const dpPrev = document.getElementById("cc-dp-prev");
    if (dpPrev) dpPrev.addEventListener("click", () => {
      datePickerViewMonth -= 1;
      if (datePickerViewMonth < 0) { datePickerViewMonth = 11; datePickerViewYear -= 1; }
      render();
    });
    const dpNext = document.getElementById("cc-dp-next");
    if (dpNext) dpNext.addEventListener("click", () => {
      datePickerViewMonth += 1;
      if (datePickerViewMonth > 11) { datePickerViewMonth = 0; datePickerViewYear += 1; }
      render();
    });
    const dpToday = document.getElementById("cc-dp-today");
    if (dpToday) dpToday.addEventListener("click", () => {
      const t = todayStr();
      setSelectedValueForTarget(datePickerTarget, t);
      datePickerOpen = false;
      render();
    });
    root.querySelectorAll("[data-dppick]").forEach((btn) => {
      btn.addEventListener("click", () => {
        setSelectedValueForTarget(datePickerTarget, btn.getAttribute("data-dppick"));
        datePickerOpen = false;
        render();
      });
    });

    const submitBtn = document.getElementById("cc-submit");
    if (submitBtn) submitBtn.addEventListener("click", () => {
      const amountVal = document.getElementById("cc-amount").value;
      const categoryVal = document.getElementById("cc-category").value;
      const medioVal = document.getElementById("cc-medio").value;
      const noteVal = document.getElementById("cc-note").value;
      const dateVal = fDate || todayStr();
      const amt = parseFloat(amountVal);
      if (!amt || amt <= 0) {
        errorMsg = "Ingresa un monto válido.";
        fAmount = amountVal; fCategory = categoryVal; fMedio = medioVal; fNote = noteVal; fDate = dateVal;
        render();
        return;
      }
      if (editingMovimientoId) {
        const m = movimientos.find((x) => x.id === editingMovimientoId);
        if (m) {
          m.type = fType;
          m.amount = amt;
          m.category = categoryVal.trim() || CATS[fType][CATS[fType].length - 1];
          m.medio = medioVal;
          m.note = noteVal.trim();
          m.date = dateVal;
        }
        saveData();
        tab = fType;
        resetForm();
        showForm = false;
        showToast("Movimiento actualizado");
        render();
        return;
      }
      movimientos.unshift({
        id: uid(), type: fType, amount: amt,
        category: categoryVal.trim() || CATS[fType][CATS[fType].length - 1],
        medio: medioVal, note: noteVal.trim(), date: dateVal, createdAt: Date.now(),
      });
      saveData();
      tab = fType;
      resetForm();
      showForm = false;
      render();
    });

    // ---- Vender page events ----
    const newProductBtn = document.getElementById("cc-new-product");
    if (newProductBtn) newProductBtn.addEventListener("click", () => { resetProductForm(); showProductForm = true; render(); });

    root.querySelectorAll("[data-addproduct]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-addproduct");
        const p = productos.find((x) => x.id === id);
        if (!p) return;
        if (stockAvailable(p) <= 0) { showToast("No hay más stock disponible"); return; }
        cart[id] = (cart[id] || 0) + 1;
        render();
      });
    });

    const cobrarBtn = document.getElementById("cc-cobrar-btn");
    if (cobrarBtn) cobrarBtn.addEventListener("click", () => { ventaError = ""; showCheckout = true; render(); });

    const checkoutOverlay = document.getElementById("cc-checkout-overlay");
    if (checkoutOverlay) checkoutOverlay.addEventListener("click", () => { showCheckout = false; render(); });
    const checkoutClose = document.getElementById("cc-checkout-close");
    if (checkoutClose) checkoutClose.addEventListener("click", () => { showCheckout = false; render(); });

    root.querySelectorAll("[data-qtyinc]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-qtyinc");
        const p = productos.find((x) => x.id === id);
        if (p && stockAvailable(p) <= 0) { showToast("No hay más stock disponible"); return; }
        cart[id] = (cart[id] || 0) + 1;
        render();
      });
    });
    root.querySelectorAll("[data-qtydec]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-qtydec");
        if (!cart[id]) return;
        cart[id] -= 1;
        if (cart[id] <= 0) delete cart[id];
        if (Object.keys(cart).length === 0) showCheckout = false;
        render();
      });
    });

    const ventaMedioSel = document.getElementById("cc-venta-medio");
    if (ventaMedioSel) ventaMedioSel.addEventListener("change", () => { ventaMedio = ventaMedioSel.value; });

    const confirmVentaBtn = document.getElementById("cc-confirm-venta");
    if (confirmVentaBtn) confirmVentaBtn.addEventListener("click", () => {
      const items = Object.entries(cart).map(([id, qty]) => ({ p: productos.find((x) => x.id === id), qty })).filter((x) => x.p);
      if (items.length === 0) { ventaError = "Tu carrito está vacío."; render(); return; }
      const medioVal = document.getElementById("cc-venta-medio").value;
      const total = items.reduce((s, it) => s + it.p.price * it.qty, 0);
      const note = items.map((it) => `${it.qty}x ${it.p.name}`).join(", ");
      movimientos.unshift({
        id: uid(), type: "ingreso", amount: total, category: "Ventas",
        medio: medioVal, note, date: todayStr(), createdAt: Date.now(),
      });
      items.forEach((it) => {
        ventasDetalle.unshift({
          id: uid(), productId: it.p.id, name: it.p.name, qty: it.qty,
          subtotal: it.p.price * it.qty, date: todayStr(), createdAt: Date.now(),
        });
        if (it.p.stock !== null && it.p.stock !== undefined) {
          it.p.stock = Math.max(0, it.p.stock - it.qty);
        }
      });
      saveData();
      saveProducts();
      saveVentasDetalle();
      cart = {};
      showCheckout = false;
      ventaError = "";
      tab = "ingreso";
      showToast("Venta registrada");
      render();
    });

    const productOverlay = document.getElementById("cc-product-overlay");
    if (productOverlay) productOverlay.addEventListener("click", () => { showProductForm = false; render(); });
    const productClose = document.getElementById("cc-product-close");
    if (productClose) productClose.addEventListener("click", () => { showProductForm = false; render(); });

    const saveProductBtn = document.getElementById("cc-save-product");
    if (saveProductBtn) saveProductBtn.addEventListener("click", () => {
      const nameVal = document.getElementById("cc-p-name").value.trim();
      const priceVal = parseFloat(document.getElementById("cc-p-price").value);
      const stockRaw = document.getElementById("cc-p-stock").value;
      const stockVal = stockRaw.trim() === "" ? null : Math.max(0, parseInt(stockRaw, 10) || 0);
      if (!nameVal) { errorMsg = "Ingresa un nombre para el producto."; pFormName = nameVal; render(); return; }
      if (!priceVal || priceVal <= 0) { errorMsg = "Ingresa un precio válido."; pFormName = nameVal; pFormPrice = document.getElementById("cc-p-price").value; render(); return; }
      if (editingProductId) {
        const p = productos.find((x) => x.id === editingProductId);
        if (p) { p.name = nameVal; p.price = priceVal; p.stock = stockVal; }
        saveProducts();
        resetProductForm();
        showProductForm = false;
        showToast("Producto actualizado");
        render();
        return;
      }
      productos.unshift({ id: uid(), name: nameVal, price: priceVal, stock: stockVal, createdAt: Date.now() });
      saveProducts();
      resetProductForm();
      showProductForm = false;
      showToast("Producto agregado");
      render();
    });

    // ---- Inventario page events ----
    const invSearchInput = document.getElementById("cc-inv-search");
    if (invSearchInput) invSearchInput.addEventListener("input", () => {
      invSearch = invSearchInput.value; render();
      const el = document.getElementById("cc-inv-search");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });

    root.querySelectorAll("[data-editproduct]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const p = productos.find((x) => x.id === btn.getAttribute("data-editproduct"));
        if (!p) return;
        editingProductId = p.id;
        pFormName = p.name;
        pFormPrice = String(p.price);
        pFormStock = p.stock == null ? "" : String(p.stock);
        errorMsg = "";
        showProductForm = true;
        render();
      });
    });

    root.querySelectorAll("[data-delproduct]").forEach((btn) => {
      btn.addEventListener("click", () => { confirmDeleteProductId = btn.getAttribute("data-delproduct"); render(); });
    });
    root.querySelectorAll("[data-delproduct-yes]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-delproduct-yes");
        productos = productos.filter((x) => x.id !== id);
        confirmDeleteProductId = null;
        saveProducts();
        showToast("Producto eliminado");
        render();
      });
    });
    root.querySelectorAll("[data-delproduct-no]").forEach((btn) => {
      btn.addEventListener("click", () => { confirmDeleteProductId = null; render(); });
    });

    root.querySelectorAll("[data-stockinc]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const p = productos.find((x) => x.id === btn.getAttribute("data-stockinc"));
        if (!p) return;
        p.stock = (p.stock || 0) + 1;
        saveProducts();
        render();
      });
    });
    root.querySelectorAll("[data-stockdec]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const p = productos.find((x) => x.id === btn.getAttribute("data-stockdec"));
        if (!p) return;
        p.stock = Math.max(0, (p.stock || 0) - 1);
        saveProducts();
        render();
      });
    });

    // ---- Estadísticas page events ----
    const statsPeriodSel = document.getElementById("cc-stats-period");
    if (statsPeriodSel) statsPeriodSel.addEventListener("change", () => { statsPeriod = statsPeriodSel.value; render(); });

    const gotoVenderBtn = document.getElementById("cc-goto-vender");
    if (gotoVenderBtn) gotoVenderBtn.addEventListener("click", () => { page = "vender"; render(); });

    const statsSettingsBtn = document.getElementById("cc-stats-settings");
    if (statsSettingsBtn) statsSettingsBtn.addEventListener("click", () => { showToast("Sin ajustes adicionales en esta versión"); });

    root.querySelectorAll("[data-comingsoon]").forEach((btn) => {
      btn.addEventListener("click", () => { showToast("Esta función no está incluida en esta versión personal"); });
    });

    // ---- Clientes page events ----
    const cliSearchInput = document.getElementById("cc-cli-search");
    if (cliSearchInput) cliSearchInput.addEventListener("input", () => {
      clienteSearch = cliSearchInput.value; render();
      const el = document.getElementById("cc-cli-search");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });

    const newClientBtn = document.getElementById("cc-new-client");
    if (newClientBtn) newClientBtn.addEventListener("click", () => {
      editingClienteId = null; cFormName = ""; cFormPhone = ""; clienteFormError = "";
      showClientForm = true; render();
    });

    const clientOverlay = document.getElementById("cc-client-overlay");
    if (clientOverlay) clientOverlay.addEventListener("click", () => { showClientForm = false; render(); });
    const clientClose = document.getElementById("cc-client-close");
    if (clientClose) clientClose.addEventListener("click", () => { showClientForm = false; render(); });

    const saveClientBtn = document.getElementById("cc-save-client");
    if (saveClientBtn) saveClientBtn.addEventListener("click", () => {
      const nameVal = document.getElementById("cc-c-name").value.trim();
      const phoneVal = document.getElementById("cc-c-phone").value.trim();
      if (!nameVal) { clienteFormError = "Ingresa un nombre."; render(); return; }
      if (editingClienteId) {
        const c = clientes.find((x) => x.id === editingClienteId);
        if (c) { c.name = nameVal; c.phone = phoneVal; }
        showToast("Cliente actualizado");
      } else {
        clientes.unshift({ id: uid(), name: nameVal, phone: phoneVal, createdAt: Date.now() });
        showToast("Cliente agregado");
      }
      saveClientes();
      showClientForm = false;
      editingClienteId = null; cFormName = ""; cFormPhone = ""; clienteFormError = "";
      render();
    });

    root.querySelectorAll("[data-openclient]").forEach((row) => {
      row.addEventListener("click", () => {
        detailClienteId = row.getAttribute("data-openclient");
        activeClienteAction = null;
        clienteFormError = "";
        confirmDeleteClienteId = null;
        showClienteDetail = true;
        render();
      });
    });

    const detailOverlay = document.getElementById("cc-detail-overlay");
    if (detailOverlay) detailOverlay.addEventListener("click", () => { showClienteDetail = false; activeClienteAction = null; render(); });
    const detailClose = document.getElementById("cc-detail-close");
    if (detailClose) detailClose.addEventListener("click", () => { showClienteDetail = false; activeClienteAction = null; render(); });

    root.querySelectorAll("[data-clientaction]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const action = btn.getAttribute("data-clientaction");
        activeClienteAction = activeClienteAction === action ? null : action;
        clienteFormError = "";
        fiadoAmount = ""; fiadoNote = ""; abonoAmount = ""; abonoNote = "";
        render();
      });
    });

    const saveFiadoBtn = document.getElementById("cc-save-fiado");
    if (saveFiadoBtn) saveFiadoBtn.addEventListener("click", () => {
      const amt = parseFloat(document.getElementById("cc-fiado-amount").value);
      const note = document.getElementById("cc-fiado-note").value.trim();
      if (!amt || amt <= 0) { clienteFormError = "Ingresa un monto válido."; render(); return; }
      const c = clientes.find((x) => x.id === detailClienteId);
      clienteMovimientos.unshift({ id: uid(), clienteId: detailClienteId, tipo: "fiado", monto: amt, nota: note, date: todayStr(), createdAt: Date.now() });
      movimientos.unshift({ id: uid(), type: "por_cobrar", amount: amt, category: "Cliente", medio: "", note: (c ? c.name + (note ? ": " + note : "") : note || "Fiado"), date: todayStr(), createdAt: Date.now() });
      saveClienteMov(); saveData();
      activeClienteAction = null; clienteFormError = "";
      showToast("Fiado registrado");
      render();
    });

    const saveAbonoBtn = document.getElementById("cc-save-abono");
    if (saveAbonoBtn) saveAbonoBtn.addEventListener("click", () => {
      const amt = parseFloat(document.getElementById("cc-abono-amount").value);
      const note = document.getElementById("cc-abono-note").value.trim();
      if (!amt || amt <= 0) { clienteFormError = "Ingresa un monto válido."; render(); return; }
      const c = clientes.find((x) => x.id === detailClienteId);
      clienteMovimientos.unshift({ id: uid(), clienteId: detailClienteId, tipo: "abono", monto: amt, nota: note, date: todayStr(), createdAt: Date.now() });
      movimientos.unshift({ id: uid(), type: "ingreso", amount: amt, category: "Cobros", medio: "Efectivo", note: (c ? c.name + (note ? ": " + note : "") : note || "Abono"), date: todayStr(), createdAt: Date.now() });
      saveClienteMov(); saveData();
      activeClienteAction = null; clienteFormError = "";
      showToast("Abono registrado");
      render();
    });

    const editClientBtn = document.getElementById("cc-edit-client");
    if (editClientBtn) editClientBtn.addEventListener("click", () => {
      const c = clientes.find((x) => x.id === detailClienteId);
      if (!c) return;
      editingClienteId = c.id; cFormName = c.name; cFormPhone = c.phone || ""; clienteFormError = "";
      showClienteDetail = false;
      showClientForm = true;
      render();
    });

    const delClientStart = document.getElementById("cc-delclient-start");
    if (delClientStart) delClientStart.addEventListener("click", () => { confirmDeleteClienteId = detailClienteId; render(); });
    const delClientYes = document.getElementById("cc-delclient-yes");
    if (delClientYes) delClientYes.addEventListener("click", () => {
      clientes = clientes.filter((x) => x.id !== detailClienteId);
      clienteMovimientos = clienteMovimientos.filter((m) => m.clienteId !== detailClienteId);
      saveClientes(); saveClienteMov();
      showClienteDetail = false; confirmDeleteClienteId = null; detailClienteId = null;
      showToast("Cliente eliminado");
      render();
    });
    const delClientNo = document.getElementById("cc-delclient-no");
    if (delClientNo) delClientNo.addEventListener("click", () => { confirmDeleteClienteId = null; render(); });

    // ---- Proveedores page events ----
    const pvSearchInput = document.getElementById("cc-pv-search");
    if (pvSearchInput) pvSearchInput.addEventListener("input", () => {
      proveedorSearch = pvSearchInput.value; render();
      const el = document.getElementById("cc-pv-search");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });

    const newProveedorBtn = document.getElementById("cc-new-proveedor");
    if (newProveedorBtn) newProveedorBtn.addEventListener("click", () => {
      editingProveedorId = null; pvFormName = ""; pvFormPhone = ""; proveedorFormError = "";
      showProveedorForm = true; render();
    });

    const proveedorOverlay = document.getElementById("cc-proveedor-overlay");
    if (proveedorOverlay) proveedorOverlay.addEventListener("click", () => { showProveedorForm = false; render(); });
    const proveedorClose = document.getElementById("cc-proveedor-close");
    if (proveedorClose) proveedorClose.addEventListener("click", () => { showProveedorForm = false; render(); });

    const saveProveedorBtn = document.getElementById("cc-save-proveedor");
    if (saveProveedorBtn) saveProveedorBtn.addEventListener("click", () => {
      const nameVal = document.getElementById("cc-pv-name").value.trim();
      const phoneVal = document.getElementById("cc-pv-phone").value.trim();
      if (!nameVal) { proveedorFormError = "Ingresa un nombre."; render(); return; }
      if (editingProveedorId) {
        const p = proveedores.find((x) => x.id === editingProveedorId);
        if (p) { p.name = nameVal; p.phone = phoneVal; }
        showToast("Proveedor actualizado");
      } else {
        proveedores.unshift({ id: uid(), name: nameVal, phone: phoneVal, createdAt: Date.now() });
        showToast("Proveedor agregado");
      }
      saveProveedores();
      showProveedorForm = false;
      editingProveedorId = null; pvFormName = ""; pvFormPhone = ""; proveedorFormError = "";
      render();
    });

    root.querySelectorAll("[data-openproveedor]").forEach((row) => {
      row.addEventListener("click", () => {
        detailProveedorId = row.getAttribute("data-openproveedor");
        activeProveedorAction = null;
        proveedorFormError = "";
        confirmDeleteProveedorId = null;
        showProveedorDetail = true;
        render();
      });
    });

    const pvDetailOverlay = document.getElementById("cc-pvdetail-overlay");
    if (pvDetailOverlay) pvDetailOverlay.addEventListener("click", () => { showProveedorDetail = false; activeProveedorAction = null; render(); });
    const pvDetailClose = document.getElementById("cc-pvdetail-close");
    if (pvDetailClose) pvDetailClose.addEventListener("click", () => { showProveedorDetail = false; activeProveedorAction = null; render(); });

    root.querySelectorAll("[data-proveedoraction]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const action = btn.getAttribute("data-proveedoraction");
        activeProveedorAction = activeProveedorAction === action ? null : action;
        proveedorFormError = "";
        compraAmount = ""; compraNote = ""; pagoAmount = ""; pagoNote = "";
        render();
      });
    });

    const saveCompraBtn = document.getElementById("cc-save-compra");
    if (saveCompraBtn) saveCompraBtn.addEventListener("click", () => {
      const amt = parseFloat(document.getElementById("cc-compra-amount").value);
      const note = document.getElementById("cc-compra-note").value.trim();
      if (!amt || amt <= 0) { proveedorFormError = "Ingresa un monto válido."; render(); return; }
      const p = proveedores.find((x) => x.id === detailProveedorId);
      proveedorMovimientos.unshift({ id: uid(), proveedorId: detailProveedorId, tipo: "compra", monto: amt, nota: note, date: todayStr(), createdAt: Date.now() });
      movimientos.unshift({ id: uid(), type: "por_pagar", amount: amt, category: "Proveedor", medio: "", note: (p ? p.name + (note ? ": " + note : "") : note || "Compra"), date: todayStr(), createdAt: Date.now() });
      saveProveedorMov(); saveData();
      activeProveedorAction = null; proveedorFormError = "";
      showToast("Compra registrada");
      render();
    });

    const savePagoBtn = document.getElementById("cc-save-pago");
    if (savePagoBtn) savePagoBtn.addEventListener("click", () => {
      const amt = parseFloat(document.getElementById("cc-pago-amount").value);
      const note = document.getElementById("cc-pago-note").value.trim();
      if (!amt || amt <= 0) { proveedorFormError = "Ingresa un monto válido."; render(); return; }
      const p = proveedores.find((x) => x.id === detailProveedorId);
      proveedorMovimientos.unshift({ id: uid(), proveedorId: detailProveedorId, tipo: "pago", monto: amt, nota: note, date: todayStr(), createdAt: Date.now() });
      movimientos.unshift({ id: uid(), type: "egreso", amount: amt, category: "Proveedor", medio: "Efectivo", note: (p ? p.name + (note ? ": " + note : "") : note || "Pago"), date: todayStr(), createdAt: Date.now() });
      saveProveedorMov(); saveData();
      activeProveedorAction = null; proveedorFormError = "";
      showToast("Pago registrado");
      render();
    });

    const editProveedorBtn = document.getElementById("cc-edit-proveedor");
    if (editProveedorBtn) editProveedorBtn.addEventListener("click", () => {
      const p = proveedores.find((x) => x.id === detailProveedorId);
      if (!p) return;
      editingProveedorId = p.id; pvFormName = p.name; pvFormPhone = p.phone || ""; proveedorFormError = "";
      showProveedorDetail = false;
      showProveedorForm = true;
      render();
    });

    const delProveedorStart = document.getElementById("cc-delproveedor-start");
    if (delProveedorStart) delProveedorStart.addEventListener("click", () => { confirmDeleteProveedorId = detailProveedorId; render(); });
    const delProveedorYes = document.getElementById("cc-delproveedor-yes");
    if (delProveedorYes) delProveedorYes.addEventListener("click", () => {
      proveedores = proveedores.filter((x) => x.id !== detailProveedorId);
      proveedorMovimientos = proveedorMovimientos.filter((m) => m.proveedorId !== detailProveedorId);
      saveProveedores(); saveProveedorMov();
      showProveedorDetail = false; confirmDeleteProveedorId = null; detailProveedorId = null;
      showToast("Proveedor eliminado");
      render();
    });
    const delProveedorNo = document.getElementById("cc-delproveedor-no");
    if (delProveedorNo) delProveedorNo.addEventListener("click", () => { confirmDeleteProveedorId = null; render(); });

    // ---- Configuraciones page events ----
    const saveSettingsBtn = document.getElementById("cc-save-settings");
    if (saveSettingsBtn) saveSettingsBtn.addEventListener("click", () => {
      const businessVal = document.getElementById("cc-cfg-business").value.trim();
      const ownerVal = document.getElementById("cc-cfg-owner").value.trim();
      const currencyVal = document.getElementById("cc-cfg-currency").value.trim();
      settings.businessName = businessVal || "Mi negocio";
      settings.ownerName = ownerVal || "Propietario";
      settings.currency = currencyVal || "$";
      saveSettings();
      showToast("Configuración guardada");
      render();
    });

    const savePinBtn = document.getElementById("cc-save-pin");
    if (savePinBtn) savePinBtn.addEventListener("click", () => {
      const pinWasSet = !!settings.pin;
      const newPin = document.getElementById("cc-sec-new").value.trim();
      const confirmPin = document.getElementById("cc-sec-confirm").value.trim();
      const currentPin = pinWasSet ? document.getElementById("cc-sec-current").value.trim() : "";
      if (pinWasSet && currentPin !== settings.pin) { secError = "El PIN actual no coincide."; render(); return; }
      if (!/^\d{4}$/.test(newPin)) { secError = "El PIN debe tener 4 dígitos."; render(); return; }
      if (newPin !== confirmPin) { secError = "Los PIN no coinciden."; render(); return; }
      settings.pin = newPin;
      saveSettings();
      secNewPin = ""; secConfirmPin = ""; secCurrentPin = ""; secError = "";
      showToast(pinWasSet ? "PIN actualizado" : "Bloqueo activado");
      render();
    });

    const removePinStart = document.getElementById("cc-remove-pin-start");
    if (removePinStart) removePinStart.addEventListener("click", () => { showRemovePinConfirm = true; secError = ""; render(); });
    const removePinNo = document.getElementById("cc-remove-pin-no");
    if (removePinNo) removePinNo.addEventListener("click", () => { showRemovePinConfirm = false; secError = ""; render(); });
    const removePinYes = document.getElementById("cc-remove-pin-yes");
    if (removePinYes) removePinYes.addEventListener("click", () => {
      const val = document.getElementById("cc-remove-pin-input").value.trim();
      if (val !== settings.pin) { secError = "PIN incorrecto."; render(); return; }
      settings.pin = null;
      saveSettings();
      showRemovePinConfirm = false; secError = "";
      showToast("Bloqueo desactivado");
      render();
    });

    const exportBackupBtn = document.getElementById("cc-export-backup");
    if (exportBackupBtn) exportBackupBtn.addEventListener("click", async () => {
      try {
        const result = await downloadJSON({
          exportado: new Date().toISOString(),
          movimientos, productos, ventasDetalle,
          clientes, clienteMovimientos,
          proveedores, proveedorMovimientos,
          settings,
        }, "respaldo_control.json");
        showToast(result && result.status === "delivered" ? "Respaldo enviado" : "Respaldo descargado");
      } catch (err) {
        showToast(downloadErrorMessage(err));
      }
    });

    const resetAllStart = document.getElementById("cc-reset-all-start");
    if (resetAllStart) resetAllStart.addEventListener("click", () => { confirmResetAll = true; render(); });
    const resetAllNo = document.getElementById("cc-reset-all-no");
    if (resetAllNo) resetAllNo.addEventListener("click", () => { confirmResetAll = false; render(); });
    const resetAllYes = document.getElementById("cc-reset-all-yes");
    if (resetAllYes) resetAllYes.addEventListener("click", async () => {
      await resetAllData();
      confirmResetAll = false;
      cart = {}; tab = "ingreso"; page = "balance";
      showToast("Todos los datos fueron eliminados");
      render();
    });

    // ---- Ayuda page events ----
    root.querySelectorAll("[data-faq]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-faq");
        expandedHelpId = expandedHelpId === id ? null : id;
        render();
      });
    });
  }

  loadData();
  loadProducts();
  loadVentasDetalle();
  loadClientes();
  loadClienteMov();
  loadProveedores();
  loadProveedorMov();
  loadSettings();
})();
</script>

</body>
</html>
